<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quiz final de IESC III</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--mag:#E5007D;--pur:#5B2C86;--purd:#3D1E5C;--bg:#F7F5FA;--tx:#2B2038;--mu:#7A7188;--bd:#E7E1EE;--ok:#1F9D55;--no:#D33A5A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:linear-gradient(115deg,var(--mag),var(--pur) 65%,var(--purd));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:15px;font-weight:800}
header span{font-size:12px;opacity:.9}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(59,20,90,.08);padding:18px;margin-bottom:14px}
h2{margin:0 0 6px;font-size:18px;color:var(--pur)}
p{margin:0 0 10px;font-size:14px;line-height:1.45}
.mu{color:var(--mu);font-size:13px}
.ubs{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:9px;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--tx)}
.ubs[disabled]{opacity:.45}
.ubs small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.enun{font-size:17px;font-weight:600;line-height:1.4;margin:0 0 14px}
.timer{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:6px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--pur));width:100%}
.tt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;width:100%;border:0;border-radius:12px;padding:16px 14px;margin-bottom:10px;color:#fff;font-family:inherit;font-size:15px;font-weight:600;text-align:left;line-height:1.3}
.opt .s{font-size:20px;width:26px;flex:none;text-align:center}
.o0{background:#E21B3C}.o1{background:#1368CE}.o2{background:#D89E00}.o3{background:#26890C}
.opt.sel{outline:4px solid var(--tx);outline-offset:2px}
.opt.dim{opacity:.35}
.opt.certa{outline:4px solid var(--ok);outline-offset:2px}
.opt[disabled]{pointer-events:none}
.big{text-align:center;padding:26px 14px}
.big .e{font-size:54px;line-height:1}
.big h2{font-size:22px;margin-top:10px}
.rk{width:100%;border-collapse:collapse;font-size:13.5px}
.rk td{padding:7px 4px;border-bottom:1px solid var(--bd)}
.rk tr.me td{font-weight:800;color:var(--mag)}
.rk td:last-child{text-align:right}
.err{color:var(--no);font-size:13px}
</style>
</head>
<body>
<header><b>Quiz final · IESC III</b><span id="hd"></span></header>
<div class="wrap" id="app"><div class="card"><p class="mu">Carregando…</p></div></div>

<script>
const sb=supabase.createClient("https://baovebzbbakuldnaxcqg.supabase.co","sb_publishable_tLl96E8cG8vsvY59_gHBVw_yMjQldp_");
const SH=['▲','◆','●','■'];
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=u=>u.replace(' | ',' / ');
let team=null;try{team=JSON.parse(localStorage.getItem('quiz_iesc3_team')||'null');}catch(e){}
let st=null,offset=0,sig='',msg='',pend=null;

function saveTeam(t){team=t;try{t?localStorage.setItem('quiz_iesc3_team',JSON.stringify(t)):localStorage.removeItem('quiz_iesc3_team');}catch(e){}}
function restante(){
  if(!st||!st.inicio_em)return 0;
  const fim=Date.parse(st.inicio_em)+st.duracao_s*1000;
  return Math.max(0,(fim-(Date.now()+offset))/1000);
}
function rank(){
  const l=[...st.equipes].sort((a,b)=>b.acertos-a.acertos||((a.tempo??9e9)-(b.tempo??9e9)));
  return l;
}

async function poll(){
  try{
    const {data,error}=await sb.rpc('quiz_publico',{p_ubs:team?team.ubs:null,p_token:team?team.token:null});
    if(error)throw error;
    st=data;offset=Date.parse(data.agora)-Date.now();
    if(team&&!st.minha.valida){saveTeam(null);msg='A equipe foi liberada ou o quiz foi reiniciado. Escolha a UBS de novo.';}
    render();
  }catch(e){ if(!st)$('#app').innerHTML='<div class="card"><p class="err">Sem conexão. Tentando de novo…</p></div>'; }
}

function render(){
  const v=team&&st.minha.valida;
  const key=[v,st.fase,st.q_atual,st.minha.opcao,pend,msg,v?'':st.equipes.map(e=>e.conectada).join('')].join('|');
  $('#hd').textContent=v?nm(team.ubs):'';
  if(key!==sig){sig=key;$('#app').innerHTML=tela(v);bind();}
  tick();
}

function tela(v){
  if(!v){
    return `<div class="card"><h2>Escolha a sua UBS</h2><p class="mu">Só <b>um celular por UBS</b> responde pela equipe. Combinem entre vocês quem será.</p>${msg?`<p class="err">${E(msg)}</p>`:''}`+
      st.equipes.map(e=>`<button class="ubs" data-u="${E(e.ubs)}" ${e.conectada?'disabled':''}>${E(nm(e.ubs))}<small>${e.conectada?'Já tem um celular conectado':'Livre'}</small></button>`).join('')+`</div>`;
  }
  if(st.fase==='lobby')return `<div class="card big"><div class="e">✅</div><h2>Equipe conectada</h2><p>${E(nm(team.ubs))}</p><p class="mu">Aguarde o professor iniciar. As perguntas aparecem aqui e na projeção.</p></div>`;
  if(st.fase==='pergunta'){
    const p=st.pergunta;const sel=pend!==null?pend:st.minha.opcao;
    return `<div class="card"><div class="timer"><i id="tb"></i></div><div class="tt"><span>Pergunta ${p.ordem} de ${st.total}</span><span id="tl"></span></div>
      <p class="enun">${E(p.enunciado)}</p>`+
      p.opcoes.map((o,i)=>`<button class="opt o${i} ${sel===i?'sel':''}" data-o="${i}"><span class="s">${SH[i]}</span><span>${E(o)}</span></button>`).join('')+
      `<p class="mu" id="info">${sel!=null&&sel!==undefined?'Resposta registrada. Vocês podem mudar até o fim do tempo.':'Deliberem em equipe e toquem na resposta.'}</p>${msg?`<p class="err">${E(msg)}</p>`:''}</div>`;
  }
  if(st.fase==='revelada'){
    const p=st.pergunta,c=st.correta,m=st.minha.opcao;
    const acertou=m===c;const r=rank();const pos=r.findIndex(e=>e.ubs===team.ubs)+1;const me=st.equipes.find(e=>e.ubs===team.ubs);
    return `<div class="card big"><div class="e">${m==null?'⏱️':acertou?'🎉':'❌'}</div><h2>${m==null?'Sem resposta':acertou?'Acertaram!':'Não foi dessa vez'}</h2>
      <p class="mu">Resposta certa:</p><button class="opt o${c} certa" disabled><span class="s">${SH[c]}</span><span>${E(p.opcoes[c])}</span></button>
      <p>Placar: <b>${me.acertos}</b> acerto(s) · <b>${pos}º</b> lugar</p><p class="mu">Aguarde a próxima pergunta.</p></div>`;
  }
  const r=rank();
  return `<div class="card"><h2>Resultado final</h2><table class="rk">`+r.map((e,i)=>`<tr class="${e.ubs===team.ubs?'me':''}"><td>${i+1}º</td><td>${E(nm(e.ubs))}</td><td>${e.acertos} acerto(s)</td></tr>`).join('')+`</table></div>`;
}

function bind(){
  document.querySelectorAll('.ubs[data-u]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const {data,error}=await sb.rpc('quiz_entrar',{p_ubs:b.dataset.u});
    if(error){msg='Não foi possível entrar. Tente de novo.';sig='';render();return;}
    if(!data.ok){msg='Essa UBS já tem um celular conectado. Acompanhem pela projeção.';}
    else{msg='';saveTeam({ubs:b.dataset.u,token:data.token});}
    sig='';await poll();
  });
  document.querySelectorAll('.opt[data-o]').forEach(b=>b.onclick=async()=>{
    if(restante()<=0)return;
    const o=+b.dataset.o;pend=o;msg='';sig='';render();
    const {error}=await sb.rpc('quiz_responder',{p_ubs:team.ubs,p_token:team.token,p_q:st.q_atual,p_opcao:o});
    pend=null;
    if(error){msg=(error.message||'').includes('fora do tempo')?'Tempo esgotado.':'Não foi possível enviar. Toque de novo.';}
    sig='';await poll();
  });
}
function tick(){
  const tb=$('#tb'),tl=$('#tl');
  if(tb&&st&&st.fase==='pergunta'){
    const r=restante();tb.style.width=(r/st.duracao_s*100)+'%';
    tl.textContent=r>0?Math.ceil(r)+' s':'Tempo esgotado';
    if(r<=0)document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  }
}
setInterval(poll,1500);setInterval(tick,250);poll();
</script>
</body>
</html>
